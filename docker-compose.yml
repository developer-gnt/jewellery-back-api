services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zewar-mahal-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=api/v1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-zewar_mahal}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_SYNC=false
      - DB_LOGGING=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TTL=300
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change_me_access_secret_zewar_mahal}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_refresh_secret_zewar_mahal}
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/usr/src/app/uploads
    networks:
      - zewar-network

  postgres:
    image: postgres:16-alpine
    container_name: zewar-mahal-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-zewar_mahal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-zewar_mahal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zewar-network

  redis:
    image: redis:7-alpine
    container_name: zewar-mahal-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zewar-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  zewar-network:
    driver: bridge
