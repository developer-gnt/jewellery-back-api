name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zewar_mahal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Compile TypeScript
        run: npm run build

      - name: Run TypeORM Migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: zewar_mahal_test
          DB_USER: postgres
          DB_PASS: postgres
          DB_SYNC: false
        run: npm run migration:run

      - name: Run Unit Tests
        run: npm run test

      - name: Run End-to-End Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: zewar_mahal_test
          DB_USER: postgres
          DB_PASS: postgres
          DB_SYNC: false
        run: npm run test:e2e
